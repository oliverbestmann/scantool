<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scantool</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
  /* Times and counts line up nicer with tabular figures. */
  .tnum { font-variant-numeric: tabular-nums; }
  .detail { word-break: break-all; }
</style>
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand bg-body border-bottom mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">scantool</span>
    <span class="ms-auto small text-body-secondary" id="conn">connecting…</span>
  </div>
</nav>

<main class="container pb-5">

  <div class="card mb-4">
    <div class="card-body">
      <div class="d-flex align-items-center gap-3 mb-3">
        <span class="badge rounded-pill text-bg-secondary" id="status-pill">idle</span>
        <span class="fs-5" id="headline">—</span>
        <div class="spinner-border spinner-border-sm text-primary d-none" id="spinner" role="status">
          <span class="visually-hidden">busy</span>
        </div>
      </div>

      <dl class="row row-cols-1 row-cols-md-2 mb-0 small">
        <div class="col d-flex gap-2">
          <dt class="text-body-secondary fw-normal">Session</dt>
          <dd class="mb-1 tnum" id="f-session">—</dd>
        </div>
        <div class="col d-flex gap-2">
          <dt class="text-body-secondary fw-normal">Pages</dt>
          <dd class="mb-1 tnum" id="f-pages">—</dd>
        </div>
        <div class="col d-flex gap-2">
          <dt class="text-body-secondary fw-normal text-nowrap">Last document</dt>
          <dd class="mb-1 detail" id="f-saved">—</dd>
        </div>
        <div class="col d-flex gap-2">
          <dt class="text-body-secondary fw-normal text-nowrap">Last error</dt>
          <dd class="mb-1 detail" id="f-error">—</dd>
        </div>
      </dl>

      {{if .ControlEnabled}}
      <div class="btn-group mt-3" role="group" aria-label="scanner controls">
        <button type="button" class="btn btn-outline-primary" data-key="a">
          <kbd>a</kbd> new document
        </button>
        <button type="button" class="btn btn-outline-primary" data-key="b">
          <kbd>b</kbd> add page
        </button>
        <button type="button" class="btn btn-outline-primary" data-key="c">
          <kbd>c</kbd> finish
        </button>
      </div>
      {{end}}
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-header">Action log</div>
    <div class="table-responsive">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead>
          <tr>
            <th scope="col">Time</th>
            <th scope="col">Action</th>
            <th scope="col" class="text-end">Session</th>
            <th scope="col" class="text-end">Page</th>
            <th scope="col">Detail</th>
          </tr>
        </thead>
        <tbody id="actions"></tbody>
      </table>
    </div>
    <div class="card-body text-body-secondary small d-none" id="actions-empty">
      Nothing has happened yet.
    </div>
  </div>

  <div class="card">
    <div class="card-header">Documents</div>
    <div class="table-responsive">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead>
          <tr>
            <th scope="col" class="text-end">#</th>
            <th scope="col">Started</th>
            <th scope="col">Ended</th>
            <th scope="col" class="text-end">Pages</th>
            <th scope="col">Status</th>
            <th scope="col">File</th>
          </tr>
        </thead>
        <tbody id="sessions"></tbody>
      </table>
    </div>
    <div class="card-body text-body-secondary small d-none" id="sessions-empty">
      No documents scanned yet.
    </div>
  </div>

</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div class="toast align-items-center text-bg-danger border-0" id="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toast-body"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
// Bootstrap 5.3 switches its colour mode on this attribute rather than on the
// media query alone.
const dark = window.matchMedia("(prefers-color-scheme: dark)");
const applyTheme = () =>
  document.documentElement.setAttribute("data-bs-theme", dark.matches ? "dark" : "light");
applyTheme();
dark.addEventListener("change", applyTheme);

const LABELS = {
  "daemon-started": "daemon started",
  "daemon-stopped": "daemon stopped",
  "key-pressed": "key pressed",
  "key-ignored": "key ignored",
  "web-action": "requested from web",
  "session-started": "session started",
  "page-scanned": "page scanned",
  "scan-failed": "scan failed",
  "session-saved": "document stored",
  "session-discarded": "session discarded",
  "save-failed": "storing failed",
};

const STATUS_BADGE = {
  idle: "text-bg-secondary",
  scanning: "text-bg-primary",
  saving: "text-bg-warning",
  error: "text-bg-danger",
};

const SESSION_BADGE = {
  active: "text-bg-primary",
  saved: "text-bg-success",
  discarded: "text-bg-secondary",
  failed: "text-bg-danger",
};

const el = (id) => document.getElementById(id);

function fmtTime(value) {
  if (!value) return "—";
  const d = new Date(value);
  if (isNaN(d)) return "—";
  return d.toLocaleTimeString(undefined, { hour12: false }) +
    " " + d.toLocaleDateString(undefined, { day: "2-digit", month: "2-digit" });
}

function ago(value) {
  const d = new Date(value);
  if (isNaN(d)) return "";
  const secs = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
  if (secs < 60) return secs + "s ago";
  if (secs < 3600) return Math.round(secs / 60) + "m ago";
  return Math.round(secs / 3600) + "h ago";
}

function cell(row, text, cls) {
  const td = row.insertCell();
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

function badgeCell(row, text, badge, cls) {
  const td = row.insertCell();
  const span = document.createElement("span");
  span.className = "badge rounded-pill " + badge;
  span.textContent = text;
  td.appendChild(span);
  if (cls) td.className = cls;
  return td;
}

function renderState(s) {
  const pill = el("status-pill");
  pill.textContent = s.status;
  pill.className = "badge rounded-pill " + (STATUS_BADGE[s.status] || "text-bg-secondary");

  el("spinner").classList.toggle("d-none", s.status !== "scanning" && s.status !== "saving");

  let headline = "waiting for a key press";
  if (s.status === "scanning") headline = "scanning page " + (s.pages + 1) + "…";
  else if (s.status === "saving") headline = "storing document…";
  else if (s.status === "error") headline = "last action failed";
  else if (s.session_active) headline = "session open, " + s.pages + " page(s) scanned";
  el("headline").textContent = headline;

  el("f-session").textContent = s.session_active
    ? "#" + s.session_id + ", started " + fmtTime(s.session_started_at)
    : "none";
  el("f-pages").textContent = s.session_active ? s.pages : "—";
  el("f-saved").textContent = s.last_saved_path
    ? s.last_saved_path + " (" + s.last_saved_pages + " page(s), " + ago(s.last_saved_at) + ")"
    : "—";

  const err = el("f-error");
  err.textContent = s.last_error ? s.last_error + " (" + ago(s.last_error_at) + ")" : "—";
  err.className = "mb-1 detail" + (s.last_error ? " text-danger" : "");
}

function renderActions(actions) {
  const body = el("actions");
  body.replaceChildren();
  el("actions-empty").classList.toggle("d-none", actions.length > 0);

  for (const a of actions) {
    const row = body.insertRow();
    cell(row, fmtTime(a.time), "tnum text-body-secondary text-nowrap");
    cell(row, LABELS[a.kind] || a.kind, a.error ? "text-danger" : "");
    cell(row, a.session_id ? "#" + a.session_id : "", "text-end tnum");
    cell(row, a.page || "", "text-end tnum");
    cell(row, a.error || a.detail || "",
      "detail small " + (a.error ? "text-danger" : "text-body-secondary"));
  }
}

function renderSessions(sessions) {
  const body = el("sessions");
  body.replaceChildren();
  el("sessions-empty").classList.toggle("d-none", sessions.length > 0);

  for (const s of sessions) {
    const row = body.insertRow();
    cell(row, "#" + s.id, "text-end tnum");
    cell(row, fmtTime(s.started_at), "tnum text-body-secondary text-nowrap");
    cell(row, s.ended_at ? fmtTime(s.ended_at) : "—", "tnum text-body-secondary text-nowrap");
    cell(row, s.pages, "text-end tnum");
    badgeCell(row, s.status, SESSION_BADGE[s.status] || "text-bg-secondary");
    cell(row, s.output_path || s.error || "",
      "detail small " + (s.error ? "text-danger" : "text-body-secondary"));
  }
}

function complain(message) {
  el("toast-body").textContent = message;
  bootstrap.Toast.getOrCreateInstance(el("toast")).show();
}

async function refresh() {
  const conn = el("conn");
  try {
    const res = await fetch("api/state", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    renderState(data.state);
    renderActions(data.actions);
    renderSessions(data.sessions);

    conn.textContent = "updated " + new Date().toLocaleTimeString(undefined, { hour12: false });
    conn.className = "ms-auto small text-body-secondary";
  } catch (e) {
    conn.textContent = "disconnected (" + e.message + ")";
    conn.className = "ms-auto small text-danger";
  }
}

async function submit(key) {
  const buttons = document.querySelectorAll("button[data-key]");
  buttons.forEach((b) => (b.disabled = true));
  try {
    const res = await fetch("api/action?key=" + encodeURIComponent(key), { method: "POST" });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      complain(body.error || "request failed with HTTP " + res.status);
    }
    await refresh();
  } catch (e) {
    complain(e.message);
  } finally {
    buttons.forEach((b) => (b.disabled = false));
  }
}

document.querySelectorAll("button[data-key]").forEach((b) => {
  b.addEventListener("click", () => submit(b.dataset.key));
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
